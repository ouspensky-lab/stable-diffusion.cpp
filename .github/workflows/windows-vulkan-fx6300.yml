name: Windows Vulkan build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      VULKAN_VERSION: 1.4.328.1

    steps:
      - name: Check out pinned source
        uses: actions/checkout@v6
        with:
          ref: 19bdfe22d255d5b4dff39d449318b9bc5ea2317f
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.15.1

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          curl.exe -L $url -o $installer
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed" }
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installation failed" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Build Windows Vulkan binary
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ tools not found" }
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS=/bigobj `
            -DSD_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF `
            -DSD_BUILD_SHARED_LIBS=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Save the binaries
        uses: actions/upload-artifact@v6
        with:
          name: windows-vulkan-fx6300-rx580
          path: build/bin/**
          if-no-files-found: error
